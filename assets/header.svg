<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Vitta — give your AI agent a spending limit it physically cannot break">
  <!-- Every element is fully visible in its static state; all animation below is ambient
       enhancement only. Nothing starts at opacity 0, so the banner still reads correctly
       wherever animation is throttled or unsupported (GitHub renders this via <img>). -->
  <defs>
    <linearGradient id="vh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111a2b"/>
    </linearGradient>

    <linearGradient id="vh-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e">
        <animate attributeName="offset" values="-0.55;0.45;-0.55" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.3" stop-color="#a7f3d0">
        <animate attributeName="offset" values="-0.25;0.75;-0.25" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.6" stop-color="#8b7cf0">
        <animate attributeName="offset" values="0.05;1.05;0.05" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22c55e">
        <animate attributeName="offset" values="0.5;1.5;0.5" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="vh-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="40%" stop-color="#22c55e" stop-opacity="1"/>
      <stop offset="70%" stop-color="#6C4EE3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6C4EE3" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vh-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vh-glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vh-glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C4EE3" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6C4EE3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="vh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="vh-card"><rect x="0" y="0" width="1200" height="340" rx="18"/></clipPath>

    <style>
      .vh-title  { font: 700 94px "Segoe UI","Inter",system-ui,-apple-system,Helvetica,Arial,sans-serif; letter-spacing:-3px; }
      .vh-kicker { font: 600 15px "Segoe UI","Inter",system-ui,-apple-system,Helvetica,Arial,sans-serif; letter-spacing:5px; }
      .vh-tag    { font: 400 25px "Segoe UI","Inter",system-ui,-apple-system,Helvetica,Arial,sans-serif; }
      .vh-pill   { font: 600 14px "SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    </style>
  </defs>

  <g clip-path="url(#vh-card)">
    <rect width="1200" height="340" fill="url(#vh-bg)"/>
    <rect width="1200" height="340" fill="url(#vh-grid)"/>

    <!-- drifting aurora -->
    <ellipse cx="240" cy="80" rx="330" ry="210" fill="url(#vh-glowA)">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 150,45; -50,75; 0,0" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="280" rx="360" ry="220" fill="url(#vh-glowB)">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -170,-55; 70,-25; 0,0" dur="21s" repeatCount="indefinite"/>
    </ellipse>

    <!-- shield mark -->
    <g transform="translate(96,44)">
      <path d="M23 0 L46 9.5 V26 C46 41 35 52 23 56 C11 52 0 41 0 26 V9.5 Z"
            fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="2.5"/>
      <path d="M12.5 27 l7.5 7.5 l14.5 -16" fill="none" stroke="#22c55e" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 0 L46 9.5 V26 C46 41 35 52 23 56 C11 52 0 41 0 26 V9.5 Z"
            fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5">
        <animate attributeName="opacity" values="0.5;0;0.5" dur="3.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1;1.16;1" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="164" y="79" class="vh-kicker" fill="#22c55e">AGENT SPENDING CONTROL</text>

    <text x="92" y="186" class="vh-title" fill="url(#vh-title)">VITTA</text>

    <!-- accent rule, sized to the wordmark only -->
    <rect x="96" y="204" width="352" height="2.5" fill="url(#vh-rule)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <text x="96" y="252" class="vh-tag" fill="#c9d4e0">Give your AI agent a spending limit it</text>
    <text x="96" y="290" class="vh-tag" fill="#c9d4e0">physically <tspan fill="#22c55e" font-weight="700">cannot</tspan> break.</text>

    <!-- capability pills -->
    <g>
      <rect x="700" y="112" width="190" height="36" rx="18" fill="#16a34a" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.5;0.95;0.5" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="721" y="135" class="vh-pill" fill="#4ade80">Ed25519 signed</text>
    </g>
    <g>
      <rect x="700" y="160" width="256" height="36" rx="18" fill="#f59e0b" fill-opacity="0.10" stroke="#F5A623" stroke-opacity="0.45">
        <animate attributeName="stroke-opacity" values="0.45;0.9;0.45" dur="5s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="721" y="183" class="vh-pill" fill="#fbbf24">zero LLM in the decision path</text>
    </g>
    <g>
      <rect x="700" y="208" width="222" height="36" rx="18" fill="#6C4EE3" fill-opacity="0.16" stroke="#8b7cf0" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.5;0.95;0.5" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="721" y="231" class="vh-pill" fill="#a99cf5">settled via Dodo Payments</text>
    </g>

    <!-- travelling sheen -->
    <rect x="-420" y="0" width="420" height="340" fill="url(#vh-sheen)">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 1700,0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- base bar with running highlight -->
    <rect x="0" y="332" width="1200" height="8" fill="#0b1220"/>
    <rect x="0" y="332" width="320" height="8" fill="url(#vh-rule)">
      <animateTransform attributeName="transform" type="translate"
        values="-340,0; 1240,0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="18" fill="none" stroke="#233043" stroke-width="1.5"/>
  </g>
</svg>
